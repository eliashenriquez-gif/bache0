components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required:
      - status
      - timestamp
      properties:
        status:
          type: string
          enum:
          - ok
        timestamp:
          type: string
          format: date-time
    ErrorDetail:
      type: object
      required:
      - field
      - issue
      properties:
        field:
          type: string
        issue:
          type: string
    ErrorBody:
      type: object
      required:
      - code
      - message
      - details
      - request_id
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: string
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    Pagination:
      type: object
      required:
      - page
      - limit
      - total
      - total_pages
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    Severity:
      type: string
      enum:
      - baja
      - media
      - alta
    TrafficLevel:
      type: string
      enum:
      - baja
      - media
      - alta
      - muy_alta
    CriticalInfrastructure:
      type: string
      enum:
      - ninguna
      - colegio
      - centro_salud
      - estacion_terminal
      - otra
    ReportStatus:
      type: string
      enum:
      - pendiente
      - en_revision
      - reparado
    AssignmentStatus:
      type: string
      enum:
      - asignado
    RoadClassification:
      type:
      - string
      - 'null'
      enum:
      - expresa
      - troncal
      - colectora
      - servicio
      - local
      - null
    RoadClassificationStatus:
      type: string
      enum:
      - confirmada
      - ambigua
      - pendiente
      - no_disponible
    GeocodingStatus:
      type: string
      enum:
      - resuelta
      - parcial
      - requiere_confirmacion
      - pendiente
    LocationMethod:
      type: string
      enum:
      - gps
      - pin_manual
    MunicipalitySummary:
      type: object
      required:
      - id
      - nombre
      - comuna
      - region
      - activa
      - servicio_activo
      properties:
        id:
          type: integer
        nombre:
          type: string
        comuna:
          type: string
        region:
          type: string
        activa:
          type: boolean
        servicio_activo:
          type: boolean
          description: Indica si Bache 0 recibe reportes de esta comuna.
    Municipality:
      type: object
      required:
      - id
      - nombre
      - comuna
      - region
      - activa
      - created_at
      - updated_at
      - servicio_activo
