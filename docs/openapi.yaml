openapi: 3.1.0
info:
  title: Bache 0 API
  version: 1.1.0
  summary: Contrato objetivo de API REST de Bache 0
  description: Contrato unificado de Bache 0 API v1. Las extensiones x-bache0-phase señalan la etapa prevista.
    Los ciudadanos envían reportes como invitados sin cuenta; solo personal municipal y superadministradores
    usan JWT. La operación real requiere implementar y probar cada ruta.
servers:
- url: http://localhost:3000
  description: Desarrollo local. No usar HTTP fuera de localhost.
tags:
- name: Salud
- name: Municipalidades
- name: Ubicación
- name: Autenticación
- name: Reportes
- name: Usuarios
- name: Auditoría
- name: Visión artificial
paths:
  /health:
    get:
      summary: Comprobar estado del servicio
      description: Endpoint técnico sin autenticación. Devuelve una comprobación básica del proceso API; no
        debe exponer configuración ni secretos.
      tags:
      - Salud
      x-bache0-phase: H2
      responses:
        '200':
          description: Servicio disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
      operationId: getHealth
  /api/v1/municipalidades:
    get:
      summary: Listar municipalidades
      description: Devuelve municipalidades activas con servicio Bache 0 habilitado. El parámetro incluir_inactivas
        solo es permitido para superadministrador autenticado.
      tags:
      - Municipalidades
      x-bache0-phase: H2
      responses:
        '200':
          description: Lista municipalidades activas y con servicio habilitado. No devuelve geometrías internas
            ni datos administrativos sensibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MunicipalityListResponse'
        '400':
          description: Parámetros o datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No tiene permisos para esta operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: incluir_inactivas
        in: query
        required: false
        description: Incluir inactivas; solo superadministrador.
        schema:
          type: boolean
          default: false
      security:
      - {}
      - BearerAuth: []
      operationId: listMunicipalidades
    post:
      summary: Crear municipalidad
      description: Solo superadministradores. La fila se crea activa si no se indica lo contrario.
      tags:
      - Municipalidades
      x-bache0-phase: H3 / evolución
      responses:
        '201':
          description: Municipalidad creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MunicipalityResponse'
        '400':
          description: Parámetros o datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No tiene permisos para esta operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicto de unicidad o estado incompatible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        description: Cuerpo JSON de la solicitud.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MunicipalityCreate'
      security:
      - BearerAuth: []
      operationId: createMunicipalidad
  /api/v1/municipalidades/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Identificador numérico del recurso
      schema:
        type: integer
        minimum: 1
    get:
      summary: Obtener municipalidad
      description: Devuelve los datos públicos de una municipalidad.
      tags:
      - Municipalidades
      x-bache0-phase: H2
      responses:
        '200':
          description: Municipalidad encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MunicipalityResponse'
        '400':
          description: Parámetros o datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El recurso no existe o no está disponible para el solicitante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
      operationId: getMunicipalidad
    put:
      summary: Actualizar municipalidad
      description: Solo superadministradores. Reemplaza sus campos editables. La desactivación no elimina reportes
        históricos asociados.
      tags:
      - Municipalidades
      x-bache0-phase: H3 / evolución
      responses:
        '200':
          description: Municipalidad actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MunicipalityResponse'
        '400':
          description: Parámetros o datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No tiene permisos para esta operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El recurso no existe o no está disponible para el solicitante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicto de unicidad o estado incompatible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        description: Cuerpo JSON de la solicitud.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MunicipalityUpdate'
      security:
      - BearerAuth: []
      operationId: updateMunicipalidad
    delete:
      summary: Desactivar municipalidad
      description: Desactivación lógica; no elimina físicamente la municipalidad ni sus usuarios/reportes históricos.
        Solo superadministradores.
      tags:
      - Municipalidades
      x-bache0-phase: H3 / evolución
      responses:
        '204':
          description: Municipalidad desactivada; respuesta sin cuerpo.
        '400':
          description: Parámetros o datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No tiene permisos para esta operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El recurso no existe o no está disponible para el solicitante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
      operationId: deactivateMunicipalidad
  /api/v1/ubicaciones/resolver:
    post:
      summary: Resolver ubicación
      description: Devuelve una vista previa de dirección, comuna y cobertura municipal. El backend consulta
        el proveedor geográfico configurado. Si el ciudadano mueve el pin se envían las nuevas coordenadas
        con metodo_ubicacion=pin_manual. Si la comuna no tiene cobertura responde 422 MUNICIPALIDAD_SIN_COBERTURA
        con el mensaje definido en el contrato; si no puede determinar la comuna, responde 422 UBICACION_NO_RESUELTA.
        Una calle no identificada puede quedar nula si la comuna cubierta sí se resuelve. La clasificación
        vial oficial queda pendiente para H3 si no existe una fuente fiable.
      tags:
      - Ubicación
      x-bache0-phase: H2
      responses:
        '200':
          description: Resolución completa o parcial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResolutionResponse'
        '400':
          description: Parámetros o datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Se excedió el límite de solicitudes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Dependencia necesaria temporalmente no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ubicación no resuelta o comuna sin cobertura; el reporte no se crea.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MunicipalityNotCovered:
                  summary: MUNICIPALIDAD_SIN_COBERTURA
                  value:
                    error:
                      code: MUNICIPALIDAD_SIN_COBERTURA
                      message: La comuna de {comuna_detectada} todavía no cuenta con el servicio Bache 0. Si
                        la ubicación no es correcta, mueve el pin y vuelve a verificarla.
                      details:
                      - field: comuna_detectada
                        issue: La comuna no está habilitada para el servicio.
                      request_id: req_example123
                LocationNotResolved:
                  summary: UBICACION_NO_RESUELTA
                  value:
                    error:
                      code: UBICACION_NO_RESUELTA
                      message: No pudimos confirmar la comuna de esta ubicación. Mueve el pin a la ubicación
                        del bache y vuelve a intentarlo.
                      details:
                      - field: latitud_longitud
                        issue: No se obtuvo una comuna fiable.
                      request_id: req_example123
                LowPrecision:
                  summary: LOCATION_PRECISION_LOW
                  value:
                    error:
                      code: LOCATION_PRECISION_LOW
                      message: La ubicación es poco precisa. Mueve el pin hasta la ubicación del bache y vuelve
                        a verificarla.
                      details:
                      - field: precision_ubicacion_m
                        issue: La precisión GPS supera el umbral de 50 metros.
                      request_id: req_example123
      requestBody:
        required: true
        description: Cuerpo JSON de la solicitud.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationResolveRequest'
      security: []
      operationId: resolveLocation
  /api/v1/auth/login:
    post:
      summary: Iniciar sesión
      description: Solo para funcionarios municipales y superadministradores. Valida correo y contraseña, devuelve
        JWT Bearer válido por 1800 segundos. No existe registro ni login ciudadano. El correo se normaliza;
        credenciales fallidas devuelven un error genérico. Máximo 5 intentos fallidos por origen/cuenta cada
        15 minutos. Nunca se registran contraseñas ni tokens.
      tags:
      - Autenticación
      x-bache0-phase: H2 - última fase
      responses:
        '200':
          description: Sesión municipal iniciada; el access token expira en 30 minutos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Parámetros o datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciales incorrectas, cuenta inactiva o cuenta que no pertenece al personal municipal.
            Mensaje genérico, sin revelar si el correo existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Se excedió el límite de intentos de inicio de sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        description: Cuerpo JSON de la solicitud.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
      operationId: login
  /api/v1/auth/me:
    get:
      summary: Consultar sesión actual
      description: Devuelve el perfil municipal vigente del token. Rol, estado de cuenta y municipalidad se
        leen de la base de datos; no se confían claims de autorización desactualizados.
      tags:
      - Autenticación
      x-bache0-phase: H2 - última fase
      responses:
        '200':
          description: Usuario actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
      operationId: getCurrentUser
  /api/v1/reportes:
    post:
      summary: Crear reporte ciudadano
      description: Crea un reporte ciudadano como invitado; no hay cuenta ni login ciudadano. Recibe la fotografía
        en multipart/form-data y las coordenadas confirmadas del pin. El backend resuelve y vuelve a validar
        la comuna/cobertura; no confía en comuna, dirección, municipalidad_id, estado, folio, foto_url ni datos
        de IA enviados por el cliente. Si la comuna no está cubierta o no puede resolverse, responde 422 y
        no crea el reporte. Las consultas de geocodificación pueden reutilizarse desde caché de corta duración.
      tags:
      - Reportes
      x-bache0-phase: H2
      responses:
        '201':
          description: Reporte creado y persistido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '400':
          description: Parámetros o datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Fotografía supera 10 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Formato de fotografía no permitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Comuna sin servicio Bache 0 o ubicación que no se puede resolver de forma fiable; no
            se crea el reporte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MunicipalityNotCovered:
                  summary: MUNICIPALIDAD_SIN_COBERTURA
                  value:
                    error:
                      code: MUNICIPALIDAD_SIN_COBERTURA
                      message: La comuna de {comuna_detectada} todavía no cuenta con el servicio Bache 0. Si
                        la ubicación no es correcta, mueve el pin y vuelve a verificarla.
                      details:
                      - field: comuna_detectada
                        issue: La comuna no está habilitada para el servicio.
                      request_id: req_example123
                LocationNotResolved:
                  summary: UBICACION_NO_RESUELTA
                  value:
                    error:
                      code: UBICACION_NO_RESUELTA
                      message: No pudimos confirmar la comuna de esta ubicación. Mueve el pin a la ubicación
                        del bache y vuelve a intentarlo.
                      details:
                      - field: latitud_longitud
                        issue: No se obtuvo una comuna fiable.
                      request_id: req_example123
                LowPrecision:
                  summary: LOCATION_PRECISION_LOW
                  value:
                    error:
                      code: LOCATION_PRECISION_LOW
                      message: La ubicación es poco precisa. Mueve el pin hasta la ubicación del bache y vuelve
                        a verificarla.
                      details:
                      - field: precision_ubicacion_m
                        issue: La precisión GPS supera el umbral de 50 metros.
                      request_id: req_example123
        '429':
          description: Se excedió el límite de solicitudes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Servicio geográfico temporalmente no disponible; no se crea el reporte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        description: El ciudadano no envía dirección, comuna, municipalidad_id, estado, folio ni foto_url.
          La foto es única, con JPEG/PNG/WebP hasta 10 MB.
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReportCreateRequest'
            encoding:
              foto:
                contentType: image/jpeg, image/png, image/webp
      security: []
      operationId: createReport
    get:
      summary: Listar reportes
      description: Lista paginada. Inspector y administrador municipal solo ven reportes de la municipalidad
        de su cuenta. Superadministrador puede consultar globalmente y filtrar por municipalidad. La municipalidad
        de un usuario regular nunca se toma del query.
      tags:
      - Reportes
      x-bache0-phase: H2
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPageResponse'
        '400':
          description: Parámetros o datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No tiene permisos para esta operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: estado
        in: query
        required: false
        description: Estado de gestión.
        schema:
          type: string
          enum:
          - pendiente
          - en_revision
          - reparado
      - name: severidad
        in: query
        required: false
        description: Severidad indicada por el ciudadano.
        schema:
          type: string
          enum:
          - baja
          - media
          - alta
      - name: municipalidad_id
        in: query
        required: false
        description: Filtro global; solo superadministrador.
        schema:
          type: integer
          minimum: 1
      - name: page
        in: query
        required: false
        description: Página desde 1.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        description: Resultados por página (máximo 100).
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      security:
      - BearerAuth: []
      operationId: listReports
  /api/v1/reportes/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: ID interno del reporte
      schema:
        type: integer
        minimum: 1
    get:
      summary: Obtener reporte
      description: Inspector, administrador municipal o superadministrador autorizado. Un usuario municipal
        no puede consultar un reporte de otra municipalidad; ese caso devuelve 404.
      tags:
      - Reportes
      x-bache0-phase: H2
      responses:
        '200':
          description: Reporte encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '400':
          description: Parámetros o datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No tiene permisos para esta operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El recurso no existe o no está disponible para el solicitante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
      operationId: getReport
    put:
      summary: Actualizar datos de gestión del reporte
      description: Reemplaza el conjunto de campos gestionables. No modifica la ubicación, la municipalidad,
        el usuario creador, la fotografía ni los resultados de IA; para ubicación se usa su endpoint específico.
        Requiere administrador municipal o superadministrador.
      tags:
      - Reportes
      x-bache0-phase: H2
      responses:
        '200':
          description: Reporte actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '400':
          description: Parámetros o datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No tiene permisos para esta operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El recurso no existe o no está disponible para el solicitante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        description: Cuerpo JSON de la solicitud.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportUpdateRequest'
      security:
      - BearerAuth: []
      operationId: updateReport
    delete:
      summary: Archivar reporte
      description: 'Borrado lógico: marca archived_at y registra evento de auditoría. La respuesta no contiene
        body.'
      tags:
      - Reportes
      x-bache0-phase: H2
      responses:
        '204':
          description: Reporte archivado; sin cuerpo.
        '400':
          description: Parámetros o datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No tiene permisos para esta operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El recurso no existe o no está disponible para el solicitante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
      operationId: archiveReport
  /api/v1/reportes/{id}/foto:
